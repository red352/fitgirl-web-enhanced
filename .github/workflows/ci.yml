name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 静态检查与单元测试
        run: npm run check

      - name: 端到端与视觉回归
        run: npm run test:e2e

      - name: 验证发布产物与源码同步
        run: git diff --exit-code -- dist/fitgirl-enhanced.user.js
